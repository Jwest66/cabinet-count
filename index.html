<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cabinet Count</title>
<meta name="theme-color" content="#12141A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Cabinet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="alternate icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  /* Night Pantry: a dark app all the time */
  --bg:#12141A; --surface:#1C2029; --ink:#ECEFF6; --muted:#9AA3B5; --line:#2C3240;
  --accent:#8EA8FF; --accent-ink:#0D1222; --label:#C8F23C; --label-ink:#172000;
  --warn:#FF9180; --warn-bg:#3B2220; --soft:#262B37; --ok:#4ADE80; --pending:#F5C451;
  --toast-action:#3347C4; --soon-bg:#3A2F12; --soon-line:#5A4A1C;
  --f-display:"Familjen Grotesk",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding:env(safe-area-inset-top,0px) 16px 0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 150px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.top>div{min-width:0}
h1{font:700 1.75rem/1.1 var(--f-display);letter-spacing:-.01em;margin:0}
.sync{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:.88rem;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)} .dot.pending{background:var(--pending)} .dot.off{background:var(--warn)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font:600 .88rem var(--f-body);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.icon-btn{width:40px;height:40px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.2rem;cursor:pointer}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.stat{font-size:.8rem;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--muted);font-variant-numeric:tabular-nums}
.stat b{color:var(--ink);font-weight:600}
.stat.low{background:var(--warn-bg);color:var(--warn)} .stat.low b{color:var(--warn)}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;font:500 .8rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .main{min-width:0;cursor:pointer;background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;display:flex;align-items:center;gap:12px}
.row .text{min-width:0;display:block}
.thumb{position:relative;flex:none;width:44px;height:44px;border-radius:10px;overflow:hidden;display:grid;place-items:center;font:700 1.1rem var(--f-display)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;box-sizing:border-box}
.thumb img.prod{object-fit:contain;background:#fff;padding:3px}
.thumb img.own{object-fit:cover}
.thumb.big{width:76px;height:76px;border-radius:14px;font-size:1.7rem}
.pic-row{display:flex;gap:14px;align-items:center}
.pic-actions{display:flex;flex-wrap:wrap;gap:8px}
.pic-btn{position:relative;overflow:hidden;display:inline-block}
.pic-btn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:100px;cursor:pointer;padding:0;border:0}
.name{font-weight:600;overflow-wrap:anywhere}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.78rem;color:var(--muted);margin-top:2px}
.code{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.04em}
.tag{font-size:.68rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--warn-bg);color:var(--warn)}
.stepper{display:flex;align-items:center;gap:2px}
.stepper button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 1.1rem var(--f-body);cursor:pointer}
.qty{min-width:2.4ch;text-align:center;font:600 1.15rem var(--f-display);font-variant-numeric:tabular-nums}
.qty.zero{color:var(--warn)}
.tag.soon{background:var(--soon-bg);color:var(--pending);text-transform:none;letter-spacing:.02em}
.tag.past{text-transform:none;letter-spacing:.02em}
.stat.soon{background:var(--soon-bg);color:var(--pending)} .stat.soon b{color:var(--pending)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--soon-bg);border:1px solid var(--soon-line);border-radius:12px;padding:10px 12px;font-size:.9rem}
.banner .btns{gap:6px}
.lots{display:flex;flex-direction:column;gap:2px;font-size:.84rem;color:var(--muted);margin:0;padding:0;list-style:none;font-variant-numeric:tabular-nums}
.news{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.news li{display:flex;flex-direction:column;gap:2px}
.news b{font:600 1rem var(--f-display);color:var(--ink)}
.news span{font-size:.9rem;color:var(--muted)}
.keep-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty h2{font:600 1.15rem var(--f-display);color:var(--ink);margin:0 0 6px}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.bar-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.mode{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:10px;padding:3px}
.mode button{border:0;background:none;color:var(--muted);font:600 .85rem var(--f-body);padding:7px;border-radius:8px;cursor:pointer}
.mode button[aria-pressed="true"]{background:var(--line);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .35)}
.actions{display:flex;gap:8px}
.scan{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--label);color:var(--label-ink);border-radius:12px;padding:14px;font:700 1.05rem var(--f-display);cursor:pointer;border:0}
.scan svg{width:26px;height:20px}
.ghost{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:0 16px;font:600 .9rem var(--f-body);cursor:pointer}

.sheet-bg{position:fixed;inset:0;background:rgb(0 0 0 / .6);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:92%;overflow:auto}
.sheet h2{font:700 1.3rem var(--f-display);margin:0}
.sheet h3{font:600 .72rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 0 0}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:10px;padding:11px 16px;font:600 .92rem var(--f-body);cursor:pointer;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);flex:1}
.btn.plain{background:var(--soft);color:var(--ink)}
.btn.outline{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--warn-bg);color:var(--warn)}
.btn.small{padding:6px 10px;font-size:.8rem;flex:none}
.btn:disabled{opacity:.55;cursor:default}
.note{font-size:.84rem;color:var(--muted);margin:0}
.note.err{color:var(--warn)}
.found{font-size:.84rem;color:var(--accent);margin:0}
.barcode-strip{font-family:var(--f-mono);letter-spacing:.1em}
.menu{display:flex;flex-direction:column;gap:8px}
.menu .btn{text-align:left}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.8rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.panel{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.members{display:flex;flex-direction:column}
.member{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.member:first-child{border-top:0}
.member .who{min-width:0;overflow-wrap:anywhere}
.member small{display:block;color:var(--muted);font-size:.78rem}
.invite{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.invite-code{font:500 1.4rem var(--f-mono);letter-spacing:.12em;user-select:all;-webkit-user-select:all}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}

.scanner{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:min(80vw,340px);aspect-ratio:3/2;border-radius:16px;box-shadow:0 0 0 100vmax rgb(0 0 0 / .45);border:2px solid #C8F23C}
.frame::after{content:"";position:absolute;left:8%;right:8%;top:50%;height:2px;background:#C8F23C;opacity:.8}
.scan-top,.scan-bottom{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;color:#fff}
.scan-bottom{margin-top:auto;flex-direction:column;align-items:stretch;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.scan-top button{background:rgb(255 255 255 / .16);color:#fff;border:0;border-radius:999px;padding:9px 16px;font:600 .9rem var(--f-body);cursor:pointer}
.scan-msg{text-align:center;font-size:.95rem;min-height:1.5em;text-shadow:0 1px 3px rgb(0 0 0 / .6)}
.scan-hit{background:#C8F23C;color:#172000;border-radius:12px;padding:10px 14px;text-align:center;font-weight:600}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:center;z-index:40;max-width:calc(100% - 32px);font-size:.9rem;box-shadow:0 6px 20px rgb(0 0 0 / .45)}
.toast.top{bottom:auto;top:calc(16px + env(safe-area-inset-top,0px))}
.toast button{background:none;border:0;color:var(--toast-action);font:600 .9rem var(--f-body);cursor:pointer;padding:0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Cabinet Count</h1>
      <div class="sync" id="syncLine"></div>
      <div class="stats" id="stats"></div>
    </div>
    <button class="icon-btn" id="menuBtn" aria-label="Household, backup and settings">⋯</button>
  </header>
  <input id="q" type="search" placeholder="Search items or barcodes" aria-label="Search items">
  <div class="chips" id="chips" role="group" aria-label="Filter by location"></div>
  <div id="soonBanner" class="banner" role="status" hidden></div>
  <div id="listHost"></div>
</div>

<div class="bar">
  <div class="bar-in">
    <div class="mode" role="group" aria-label="What scanning does">
      <button id="modeAdd" aria-pressed="true">Scan adds 1</button>
      <button id="modeUse" aria-pressed="false">Scan uses 1</button>
    </div>
    <div class="actions">
      <button class="scan" id="scanBtn">
        <svg viewBox="0 0 26 20" aria-hidden="true" fill="currentColor"><rect x="0" y="0" width="2" height="20"/><rect x="4" y="0" width="1" height="20"/><rect x="7" y="0" width="3" height="20"/><rect x="12" y="0" width="1" height="20"/><rect x="15" y="0" width="2" height="20"/><rect x="19" y="0" width="1" height="20"/><rect x="22" y="0" width="4" height="20"/></svg>
        Scan barcode
      </button>
      <button class="ghost" id="manualBtn">Type it</button>
    </div>
  </div>
</div>

<div class="scanner" id="scanner" hidden>
  <video id="video" playsinline muted autoplay></video>
  <div class="frame" aria-hidden="true"></div>
  <div class="scan-top">
    <button id="scanClose">Done</button>
    <button id="torchBtn" hidden>Light</button>
  </div>
  <div class="scan-bottom">
    <div class="scan-msg" id="scanMsg">Line the barcode up inside the box</div>
    <div class="scan-hit" id="scanHit" hidden></div>
  </div>
</div>

<div id="sheetHost"></div>
<div id="toastHost"></div>
<input type="file" id="restoreFile" accept="application/json,.json" hidden>

<script src="vendor/zxing.min.js"></script>
<script>
/* ===================== settings ===================== */
// Firebase web config. Not a secret: access is controlled by firestore.rules.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD8vVkOEeV61uxbol1Jnp6_uY5NCdGyVJQ",
  authDomain: "pantrycontents.firebaseapp.com",
  projectId: "pantrycontents",
  storageBucket: "pantrycontents.firebasestorage.app",
  messagingSenderId: "424251350515",
  appId: "1:424251350515:web:6e8450f2a08806353b4686"
};
// Picture relay for Kroger's product catalog (see kroger-relay/worker.js). Empty = not set up yet.
const KROGER_RELAY="https://cabinet-count-pictures.jon-namenlos.workers.dev/";
const LOCS=["Cabinet","Pantry","Fridge","Freezer","Bathroom","Other"];
const LOCAL_KEY="cabinet-count:v1";
const BACKUP_KEY="cabinet-count:v1:before-sharing";
const CLOUD_FLAG="cabinet-count:signed-in";
const APP_URL=location.origin+location.pathname.replace(/index\.html$/,"");

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const state={items:[],filter:"All",q:"",mode:"add",loading:false};
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);return true;}catch(e){return false;}}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});

/* ===================== barcode helpers ===================== */
function normCode(raw){
  let c=String(raw||"").trim().replace(/\s+/g,"");
  if(/^\d{13}$/.test(c)&&c[0]==="0")c=c.slice(1); // EAN-13 with a leading 0 is the same product as UPC-A
  return c;
}
function codeKind(c){
  if(/^\d{12}$/.test(c))return"UPC-A";if(/^\d{13}$/.test(c))return"EAN-13";
  if(/^\d{8}$/.test(c))return"EAN-8";return/^\d+$/.test(c)?"Numeric":"Code";
}
function checkOk(c){
  if(!/^(\d{8}|\d{12}|\d{13})$/.test(c))return null;
  const d=c.split("").map(Number),chk=d.pop();let s=0;
  d.reverse().forEach((n,i)=>s+=n*(i%2===0?3:1));
  return(10-s%10)%10===chk;
}
function prettyCode(c){
  if(/^\d{12}$/.test(c))return`${c[0]} ${c.slice(1,6)} ${c.slice(6,11)} ${c[11]}`;
  if(/^\d{13}$/.test(c))return`${c[0]} ${c.slice(1,7)} ${c.slice(7)}`;
  return c;
}
const findByCode=c=>state.items.find(i=>i.barcode===c);
const randId=()=>"it_"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const idForItem=d=>d.barcode?("bc_"+d.barcode.replace(/[^A-Za-z0-9]/g,"").slice(0,60)):randId();
function safeImg(u){u=String(u||"");return /^https:\/\/[^\s"'<>]{6,600}$/.test(u)?u:"";}
function safePhoto(p){p=String(p||"");return p.length<=90000&&/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(p)?p:"";}
function cleanItem(d){
  const o={name:String(d.name||"").trim().slice(0,200)||"Unnamed item",barcode:normCode(d.barcode||"").slice(0,64),
    location:!d.location?"Cabinet":LOCS.includes(d.location)?d.location:"Other",
    qty:Math.max(0,parseInt(d.qty)||0),low:Math.max(0,parseInt(d.low)||0)};
  const img=safeImg(d.img),photo=safePhoto(d.photo);
  if(img)o.img=img;
  if(photo)o.photo=photo;
  if(d.imgOff&&!img&&!photo)o.imgOff=true; // picture removed on purpose: never look again
  const t=parseInt(d.imgTry);if(t>0)o.imgTry=Math.min(t,99); // which round of picture sources was already tried
  if(Array.isArray(d.lots))o.lots=d.lots.filter(l=>l&&l.at>0&&l.n>0).slice(-60).map(l=>({at:Math.floor(l.at),n:Math.min(9999,Math.floor(l.n))}));
  const at=parseInt(d.addedAt);if(at>0)o.addedAt=at;
  if(d.cat&&(d.cat in FOOD_BY_ID))o.cat=d.cat;
  if(d.catSet&&o.cat)o.catSet=true; // you picked the food type yourself
  const k=parseInt(d.keep);if(k>0)o.keep=Math.min(k,3650);
  const ub=parseInt(d.useBy),ua=parseInt(d.useByAt);if(ub>0&&ua>0){o.useBy=ub;o.useByAt=ua;}
  return o;
}
/* ---------- freshness ---------- */
// Shelf lives in days, from USDA FoodKeeper / FSIS guidance, using the LOW end of each range
// so reminders come early rather than late. p = pantry or cabinet, f = fridge, z = freezer.
// Order matters: the first match wins, so specific foods come before general ones.
const FOODS=[
  {id:"none",label:"Not food (no reminders)",re:/\b(paper towels?|toilet paper|tissues?|napkins?|soap|detergent|shampoo|conditioner|toothpaste|mouthwash|deodorant|lotion|razors?|trash bags?|garbage bags?|aluminum foil|foil|plastic wrap|zip ?lock|ziploc|batteries|cleaner|bleach|sponges?|dish ?washer|laundry|dryer sheets|wipes|light ?bulbs?|vitamins?)\b/},
  {id:"soda",label:"Soda and sparkling drinks",p:180,f:180,re:/\b(soda|cola|coke|pepsi|sprite|ginger ale|seltzer|sparkling|la ?croix|dr\.? pepper|mountain dew|root beer|tonic water|soft drinks?|carbonated)\b/},
  {id:"water",label:"Bottled water",p:365,f:365,re:/\b(bottled water|spring water|purified water|waters)\b/},
  {id:"beer",label:"Beer",p:120,f:120,re:/\b(beer|lager|ale|ipa|stout|beers)\b/},
  {id:"juice",label:"Juice",p:365,f:7,re:/\b(juices?|lemonade|nectar)\b/},
  {id:"plantmilk",label:"Plant milk",p:180,f:7,re:/\b(almond|oat|soy|coconut|rice) (milk|beverage)\b/},
  {id:"frozenproduce",label:"Frozen vegetables or fruit",z:240,re:/\bfrozen\b[a-z ,]*\b(vegetables?|veggies|peas|corn|broccoli|spinach|green beans|berries|strawberries|blueberries|fruit|mango)\b|\bfrozen (vegetables|fruits?)\b/},
  {id:"icecream",label:"Ice cream and frozen desserts",z:60,re:/\b(ice cream|gelato|sorbet|popsicles?|frozen yogh?urt)\b/},
  {id:"cannedacid",label:"Canned tomatoes, fruit and pickles",p:365,f:365,re:/\b(crushed|diced|stewed|whole peeled|canned) tomatoes\b|\btomato (sauce|paste|puree)\b|\b(pasta|marinara|spaghetti|pizza) sauce\b|\bsalsa\b|\b(peaches|pears|pineapple|mandarin oranges|fruit cocktail|applesauce|cranberry sauce|pickles?|sauerkraut|olives)\b/},

const FOOD_BY_ID=Object.fromEntries(FOODS.map(f=>[f.id,f]));
const DAY=864e5,SOON_DAYS=14;
// How far ahead to warn: 2 weeks, or about a third of the shelf life for foods that don't last a month.
function warnDays(days){return days>0?Math.min(SOON_DAYS,Math.max(1,Math.round(days*0.3))):SOON_DAYS;}
const STORAGE={Cabinet:"p",Pantry:"p",Other:"p",Bathroom:"p",Fridge:"f",Freezer:"z"};
const STORAGE_WORD={p:"pantry",f:"fridge",z:"freezer"};
// Open Food Facts category tags ("en:canned-foods") read as plain words for matching.
function tagWords(tags){return(Array.isArray(tags)?tags:[]).slice(0,30).map(t=>String(t).replace(/^[a-z]{2}:/,"").replace(/-/g," ")).join(" ; ");}
function guessFood(text){const t=" "+String(text||"").toLowerCase().replace(/[®™]/g,"")+" ";for(const f of FOODS)if(f.re.test(t))return f.id;return"";}
function foodOf(i){return i.cat&&FOOD_BY_ID[i.cat]?i.cat:guessFood(i.name);}
// Days this item keeps where it's stored: your own number first, then the USDA estimate.
function keepDays(i){
  if(i.keep>0)return i.keep;
  const f=FOOD_BY_ID[foodOf(i)];if(!f||f.id==="none")return 0;
  const st=STORAGE[i.location]||"p";
  return f[st]||f.p||f.f||f.z||0;
}
// Units on the shelf, grouped by the day they were added (oldest first). Using one takes the oldest.
function normLots(i){
  const qty=Math.max(0,i.qty||0);
  let lots=(Array.isArray(i.lots)?i.lots:[]).filter(l=>l&&l.at>0&&l.n>0).map(l=>({at:Math.floor(l.at),n:Math.floor(l.n)})).sort((a,b)=>a.at-b.at);
  let sum=lots.reduce((s,l)=>s+l.n,0);
  while(sum>qty&&lots.length){const take=Math.min(lots[0].n,sum-qty);lots[0].n-=take;sum-=take;if(!lots[0].n)lots.shift();}
  if(sum<qty){lots.push({at:i.addedAt||i.updatedAt||Date.now(),n:qty-sum});lots.sort((a,b)=>a.at-b.at);}
  return lots;
}
const sameDay=(a,b)=>new Date(a).toDateString()===new Date(b).toDateString();
function lotsAfter(i,delta){

  else{let left=-delta;while(left>0&&lots.length){const take=Math.min(lots[0].n,left);lots[0].n-=take;left-=take;if(!lots[0].n)lots.shift();}}

function lotsForQty(i,qty){const cur=normLots(i),sum=cur.reduce((s,l)=>s+l.n,0);return lotsAfter(i,qty-sum);}
// When each group of units is due, and whether the item needs using soon.
function freshness(i){

  const next=dues.length?Math.min(...dues):0;
  const warn=warnDays(days)*DAY;
  const state=!next?"":next<=now?"past":next-now<=warn?"soon":"ok";
  const soonUnits=rows.filter(r=>r.due&&r.due-now<=warn).reduce((s,r)=>s+r.n,0);

function fmtDate(t){const d=new Date(t),y=d.getFullYear()!==new Date().getFullYear();return d.toLocaleDateString(undefined,y?{month:"short",day:"numeric",year:"numeric"}:{month:"short",day:"numeric"});}
function fmtKeep(days){
  if(days>=365&&days%365===0)return days===365?"1 year":`${days/365} years`;
  if(days>=60&&days%30===0)return`${days/30} months`;
  if(days>=14&&days%7===0)return`${days/7} weeks`;

function tileColors(name){let h=0;for(const ch of String(name||""))h=(h*31+ch.charCodeAt(0))>>>0;return TILE[h%TILE.length];}
function thumbHTML(i,big){

// Your own photo becomes a small square JPEG (about 10 KB) stored with the item.
function makeThumb(file){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const s=Math.min(im.naturalWidth,im.naturalHeight),c=document.createElement("canvas");c.width=c.height=160;
      c.getContext("2d").drawImage(im,(im.naturalWidth-s)/2,(im.naturalHeight-s)/2,s,s,0,0,160,160);
      URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",0.72));
    };
    im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("unreadable"));};
    im.src=u;
  });

// Look up pictures for items scanned before this feature existed (or added without a lookup). Once per list per visit.
const backfilled=new Set();
async function backfillPictures(){
  if(backfilled.has(store)||!navigator.onLine)return;
  const s=store;backfilled.add(s);
  const todo=state.items.filter(i=>i.barcode&&!i.img&&!i.photo&&!i.imgOff&&(i.imgTry||0)<IMG_TRY).slice(0,30);
  for(const it of todo){
    if(store!==s)return;
    const r=await lookup(it.barcode);
    const cur=state.items.find(x=>x.id===it.id);
    if(store!==s||!cur||cur.img||cur.photo)continue;
    s.patch(it.id,r&&r.image?{img:r.image,imgTry:IMG_TRY}:{imgTry:IMG_TRY});
    await new Promise(z=>setTimeout(z,800));
  }

function timeAgo(ts){
  if(!ts)return"";const s=Math.round((Date.now()-ts)/1000);
  if(s<60)return"just now";if(s<3600)return`${Math.round(s/60)} min ago`;
  if(s<86400)return`${Math.round(s/3600)} h ago`;return`${Math.round(s/86400)} days ago`;
}

/* ===================== product lookup ===================== */
async function getJSON(url,ms=6000){
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),ms);
  try{const r=await fetch(url,{signal:ctl.signal});if(!r.ok)return null;return await r.json();}
  catch(e){return null;}finally{clearTimeout(t);}
}
// UPC-E is the short 8-digit barcode on small packages (soda cans, gum). Databases file it under the full UPC-A.
function upcEtoA(e){
  if(!/^[01]\d{7}$/.test(e))return"";
  const ns=e[0],x=e.slice(1,7),c=e[7],l=x[5];let m;
  if(l<="2")m=x[0]+x[1]+l+"0000"+x[2]+x[3]+x[4];
  else if(l==="3")m=x[0]+x[1]+x[2]+"00000"+x[3]+x[4];
  else if(l==="4")m=x[0]+x[1]+x[2]+x[3]+"00000"+x[4];
  else m=x[0]+x[1]+x[2]+x[3]+x[4]+"0000"+l;
  const a=ns+m+c;return checkOk(a)?a:"";
}
// Prefer the English front photo, but take a front photo in any language over none.
function offImage(p){
  const sel=p.selected_images&&p.selected_images.front;
  const any=o=>o?Object.values(o).find(Boolean):"";
  return safeImg(p.image_front_small_url||any(sel&&sel.small)||any(sel&&sel.display)||p.image_front_url||p.image_small_url||p.image_url);
}
async function lookup(code){
  if(!/^\d{8,14}$/.test(code)||!navigator.onLine)return null;
  const upcA=code.length===8?upcEtoA(code):"";
  const tries=[];for(const c of [code,upcA])if(c){if(c.length===12)tries.push("0"+c);tries.push(c);}
  let found=null;
  for(const c of tries){
    const j=await getJSON(`https://world.openfoodfacts.org/api/v2/product/${c}.json?fields=product_name,brands,quantity,image_front_small_url,image_front_url,image_small_url,image_url,selected_images,categories_tags`);
    const p=j&&j.status===1&&j.product;
    if(!p)continue;
    const brand=(p.brands||"").split(",")[0].trim(),pn=(p.product_name||"").trim();
    const name=pn?[brand&&!pn.toLowerCase().includes(brand.toLowerCase())?brand:"",pn,p.quantity].filter(Boolean).join(" ").trim():"";
    const image=offImage(p);
    if(name||image){found={name,source:"Open Food Facts",image,tags:tagWords(p.categories_tags)};break;}
  }
  if(found&&found.name&&found.image)return found;
  if(KROGER_RELAY){
    const k=await getJSON(`${KROGER_RELAY}?upc=${upcA||code}`,8000);
    const kImg=k&&safeImg(k.image),kName=k&&typeof k.name==="string"?k.name.trim().slice(0,200):"";
    if(kImg||kName)found=found?{...found,name:found.name||kName,image:found.image||kImg}:{name:kName,source:"Kroger",image:kImg};
    if(found&&found.name&&found.image)return found;
  }
  const u=await getJSON(`https://api.upcitemdb.com/prod/trial/lookup?upc=${upcA||code}`);
  const it=u&&u.items&&u.items[0];
  if(it&&it.title){
    const image=safeImg((it.images||[]).find(x=>/^https:/.test(x)));
    if(!found)return{name:it.title.trim(),source:"UPCitemdb",image};
    return{name:found.name||it.title.trim(),source:found.source,image:found.image||image};
  }
  return found;
}

const Local={
  items:[],
  load(){try{this.items=JSON.parse(lsGet(LOCAL_KEY)||"[]");}catch(e){this.items=[];}if(!Array.isArray(this.items))this.items=[];},
  persist(){if(!lsSet(LOCAL_KEY,JSON.stringify(this.items)))toast("Couldn't save. Your phone may be out of storage.");},
  emit(){if(store===this){state.items=this.items.map(i=>({...i}));render();}},
  start(){this.load();this.emit();setTimeout(()=>{migrateLots();backfillPictures();},2500);},
  add(d){const id=randId();this.items.push({id,...cleanItem(d),updatedAt:Date.now()});this.persist();this.emit();return id;},
  update(id,d){const k=this.items.findIndex(i=>i.id===id);if(k<0)return;this.items[k]={id,...cleanItem(d),updatedAt:Date.now()};this.persist();this.emit();},
  patch(id,f){const it=this.items.find(i=>i.id===id);if(!it)return;Object.assign(it,f);this.persist();this.emit();},
  bump(id,delta){const it=this.items.find(i=>i.id===id);if(!it)return;it.lots=lotsAfter(it,delta);it.qty=Math.max(0,(it.qty||0)+delta);it.updatedAt=Date.now();this.persist();this.emit();},
  remove(id){this.items=this.items.filter(i=>i.id!==id);this.persist();this.emit();},
  restore(item){this.items.push({...item,...cleanItem(item)});this.persist();this.emit();},
  async replaceAll(items){this.items=items.map(i=>({id:i.id||randId(),...cleanItem(i),updatedAt:Date.now()}));this.persist();this.emit();}
};

const Cloud={

  userUnsub:null,unsubs:[],importQueue:null,

  async init(){
    if(this.fb)return;

      fb.connectAuthEmulator(this.auth,"http://localhost:9099",{disableWarnings:true});

  },
  stopUser(){if(this.userUnsub){this.userUnsub();this.userUnsub=null;}},
  detach(){this.unsubs.forEach(f=>f());this.unsubs=[];this.hid=null;this.household=null;this.members=[];},
  attach(hid){
    this.detach();
    if(!hid){switchStore(Local);openHouseholdSetup();return;}
    const fb=this.fb,db=this.db;
    this.hid=hid;this.pending=false;this.fromCache=true;
    state.items=[];state.loading=true;switchStore(this);
    const refreshMenu=()=>{if($("#householdPanel"))openMenu();};
    const lost=err=>{if(err&&err.code==="permission-denied")this.lostAccess();else{console.warn(err);renderSync();}};
    this.unsubs.push(fb.onSnapshot(fb.doc(db,"households",hid),s=>{this.household=s.exists()?s.data():null;renderSync();refreshMenu();},lost));
    this.unsubs.push(fb.onSnapshot(fb.collection(db,"households",hid,"members"),s=>{this.members=s.docs.map(d=>({uid:d.id,...d.data()}));renderSync();refreshMenu();},lost));
    this.unsubs.push(fb.onSnapshot(fb.collection(db,"households",hid,"items"),{includeMetadataChanges:true},s=>{
      this.pending=s.metadata.hasPendingWrites;this.fromCache=s.metadata.fromCache;
      state.items=s.docs.map(d=>({id:d.id,...d.data()}));state.loading=false;
      render();
      if(this.importQueue&&!s.metadata.fromCache)this.runImport();
      if(!s.metadata.fromCache)setTimeout(()=>{migrateLots();backfillPictures();},2500);
    },lost));
  },
  lostAccess(){
    if(!this.hid)return;
    this.detach();
    toast("You're no longer part of that household.");
    if(this.user)this.fb.setDoc(this.fb.doc(this.db,"users",this.user.uid),{householdId:null}).catch(()=>{});
    switchStore(Local);
  },
  ref(id){return this.fb.doc(this.db,"households",this.hid,"items",id);},
  stamp(){return{updatedAt:Date.now(),updatedBy:this.user.uid,updatedByName:this.myName()};},
  fail(e){
    console.warn(e);
    toast(e&&e.code==="permission-denied"?"The shared list refused that change. The database rules may need updating.":"Couldn't save that change. Try again.");
  },
  add(d){const c=cleanItem(d),id=idForItem(c);this.fb.setDoc(this.ref(id),{...c,...this.stamp()}).catch(e=>this.fail(e));return id;},
  update(id,d){this.fb.setDoc(this.ref(id),{...cleanItem(d),...this.stamp()}).catch(e=>this.fail(e));},
  bump(id,delta){
    const it=state.items.find(i=>i.id===id),f={qty:this.fb.increment(delta),...this.stamp()};
    if(it)f.lots=lotsAfter(it,delta);
    this.fb.updateDoc(this.ref(id),f).catch(e=>this.fail(e));
  },
  remove(id){this.fb.deleteDoc(this.ref(id)).catch(e=>this.fail(e));},
  patch(id,f){this.fb.updateDoc(this.ref(id),f).catch(e=>console.warn(e));},
  restore(item){this.fb.setDoc(this.ref(item.id),{...cleanItem(item),...this.stamp()}).catch(e=>this.fail(e));},
  async writeChunks(ops){
    for(let i=0;i<ops.length;i+=400){
      const b=this.fb.writeBatch(this.db);
      ops.slice(i,i+400).forEach(o=>o.del?b.delete(o.ref):b.set(o.ref,o.data));
      await b.commit();
    }
  },
  async replaceAll(items){
    const keep=new Set(),ops=[];
    for(const i of items){
      const c=cleanItem(i),id=i.id&&/^[A-Za-z0-9_\-]{1,100}$/.test(i.id)?i.id:idForItem(c);
      if(keep.has(id))continue;keep.add(id);ops.push({ref:this.ref(id),data:{...c,...this.stamp()}});
    }
    for(const i of state.items)if(!keep.has(i.id))ops.push({ref:this.ref(i.id),del:true});
    try{await this.writeChunks(ops);}catch(e){this.fail(e);}
  },
  // Items from this phone go into the shared list once, skipping anything already there.
  async runImport(){
    const queue=this.importQueue;this.importQueue=null;if(!queue||!queue.length)return;
    const haveCodes=new Set(state.items.map(i=>i.barcode).filter(Boolean));
    const haveNames=new Set(state.items.filter(i=>!i.barcode).map(i=>(i.name||"").toLowerCase()));
    const seen=new Set(),ops=[];
    for(const i of queue){
      const c=cleanItem(i),key=c.barcode||("name:"+c.name.toLowerCase());
      if(seen.has(key)||(c.barcode?haveCodes.has(c.barcode):haveNames.has(c.name.toLowerCase())))continue;
      seen.add(key);ops.push({ref:this.ref(idForItem(c)),data:{...c,...this.stamp()}});
    }
    try{
      await this.writeChunks(ops);
      lsSet(BACKUP_KEY,JSON.stringify(queue));lsSet(LOCAL_KEY,"[]");Local.load();
      if(ops.length)toast(`Moved ${ops.length} ${ops.length===1?"item":"items"} from this phone into the shared list`);
    }catch(e){this.importQueue=queue;this.fail(e);}
  },
  // ---------- household management ----------
  makeCode(){
    const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",b=new Uint8Array(8);crypto.getRandomValues(b);
    return Array.from(b,x=>A[x%32]).join("");
  },
  async createHousehold(name){
    const fb=this.fb,db=this.db,uid=this.user.uid,hid=fb.doc(fb.collection(db,"households")).id,code=this.makeCode(),now=Date.now();
    const b=fb.writeBatch(db);
    b.set(fb.doc(db,"households",hid),{name,owner:uid,inviteCode:code,createdAt:now});
    b.set(fb.doc(db,"households",hid,"members",uid),{role:"owner",name:this.myName(),email:this.user.email||"",joinedAt:now});
    b.set(fb.doc(db,"invites",code),{householdId:hid,householdName:name,createdBy:uid,createdAt:now});
    await b.commit(); // the household exists on the server before this phone starts listening to it
    this.importQueue=Local.items.slice();
    await fb.setDoc(fb.doc(db,"users",uid),{householdId:hid});
  },
  async findInvite(code){
    const s=await this.fb.getDocFromServer(this.fb.doc(this.db,"invites",code));
    return s.exists()?s.data():null;
  },
  async joinHousehold(code,invite,importLocal){
    const fb=this.fb,db=this.db,uid=this.user.uid;
    await fb.setDoc(fb.doc(db,"households",invite.householdId,"members",uid),{role:"member",code,name:this.myName(),email:this.user.email||"",joinedAt:Date.now()});
    if(importLocal)this.importQueue=Local.items.slice();
    await fb.setDoc(fb.doc(db,"users",uid),{householdId:invite.householdId});
  },
  async newInvite(){
    const fb=this.fb,db=this.db,h=this.household,code=this.makeCode();
    const b=fb.writeBatch(db);
    if(h.inviteCode)b.delete(fb.doc(db,"invites",h.inviteCode));
    b.set(fb.doc(db,"invites",code),{householdId:this.hid,householdName:h.name,createdBy:this.user.uid,createdAt:Date.now()});
    b.update(fb.doc(db,"households",this.hid),{inviteCode:code});
    await b.commit();
  },
  async removeMember(uid){await this.fb.deleteDoc(this.fb.doc(this.db,"households",this.hid,"members",uid));},
  async leave(){
    const fb=this.fb,uid=this.user.uid,hid=this.hid;
    this.detach();switchStore(Local);
    await fb.deleteDoc(fb.doc(this.db,"households",hid,"members",uid));
    await fb.setDoc(fb.doc(this.db,"users",uid),{householdId:null});
  },
  async signOut(){
    this.stopUser();this.detach();lsSet(CLOUD_FLAG,null);
    try{await this.fb.signOut(this.auth);}catch(e){}
    try{await this.fb.terminate(this.db);await this.fb.clearIndexedDbPersistence(this.db);}catch(e){}
    location.reload();
  }
};

let store=Local;
function switchStore(s){
  store=s;
  if(s===Local){state.loading=false;Local.start();}
  else render();
}

/* ===================== sync status line ===================== */
function renderSync(){
  const el=$("#syncLine");
  if(store===Local){
    if(state.loading){el.innerHTML=`<span class="dot"></span><span>Connecting…</span>`;return;}
    if(Cloud.user&&!Cloud.hid){el.innerHTML=`<span class="dot pending"></span><span>Signed in. Finish setting up your household.</span><button class="linkbtn" id="setupLink">Set up</button>`;$("#setupLink").onclick=openHouseholdSetup;return;}
    el.innerHTML=`<span class="dot"></span><span>Saved on this phone only.</span><button class="linkbtn" id="shareLink">Share with your household</button>`;
    $("#shareLink").onclick=openSignIn;return;
  }
  const h=Cloud.household,others=Cloud.members.filter(m=>m.uid!==Cloud.user?.uid).map(m=>m.name).filter(Boolean);
  const who=others.length?`Shared with ${others.join(", ")}`:"Only you so far";
  let dot="ok",status="Synced";
  if(!navigator.onLine){dot="off";status=Cloud.pending?"Offline · changes will sync":"Offline";}
  else if(Cloud.pending){dot="pending";status="Saving…";}
  else if(Cloud.fromCache){dot="pending";status="Connecting…";}
  el.innerHTML=`<span class="dot ${dot}"></span><span>${esc(h?h.name:"Household")} · ${esc(who)} · ${status}</span>`;
}
addEventListener("online",renderSync);addEventListener("offline",renderSync);

/* ===================== counting ===================== */
function bump(id,delta){
  const it=state.items.find(i=>i.id===id);if(!it)return null;
  const prev=Math.max(0,it.qty||0);
  if(delta<0&&prev===0)return{it,prev,next:0};
  store.bump(id,delta);
  return{it,prev,next:Math.max(0,prev+delta)};
}

/* ===================== render ===================== */
function render(){
  renderSync();
  const all=state.items,low=all.filter(i=>(i.qty||0)<=(i.low??0));
  const fr=new Map(all.map(i=>[i.id,freshness(i)]));
  const soon=all.filter(i=>{const f=fr.get(i.id);return f.state==="soon"||f.state==="past";});
  try{if(navigator.setAppBadge){soon.length?navigator.setAppBadge(soon.length):navigator.clearAppBadge();}}catch(e){}
  const units=all.reduce((s,i)=>s+Math.max(0,i.qty||0),0);
  $("#stats").innerHTML=all.length?`<span class="stat"><b>${all.length}</b> ${all.length===1?"item":"items"}</span><span class="stat"><b>${units}</b> on the shelf</span>${soon.length?`<span class="stat soon"><b>${soon.length}</b> use soon</span>`:""}${low.length?`<span class="stat low"><b>${low.length}</b> low or out</span>`:""}`:"";
  const locs=["All",...LOCS.filter(l=>all.some(i=>i.location===l))];
  if(low.length)locs.splice(1,0,"Low");
  if(soon.length)locs.splice(1,0,"Soon");
  if(!locs.includes(state.filter))state.filter="All";
  $("#chips").innerHTML=all.length?locs.map(l=>`<button class="chip" data-f="${esc(l)}" aria-pressed="${l===state.filter}">${l==="Low"?"Running low":l==="Soon"?"Use soon":esc(l)}</button>`).join(""):"";
  renderBanner(soon);
  const q=state.q.toLowerCase();
  const rows=all.filter(i=>state.filter==="All"||(state.filter==="Soon"?soon.includes(i):state.filter==="Low"?(i.qty||0)<=(i.low??0):i.location===state.filter))
    .filter(i=>!q||(i.name||"").toLowerCase().includes(q)||(i.barcode||"").includes(q))
    .sort(state.filter==="Soon"?(a,b)=>fr.get(a.id).next-fr.get(b.id).next:(a,b)=>(a.name||"").localeCompare(b.name||""));
  if(state.loading&&!all.length){$("#listHost").innerHTML=`<div class="list"><div class="empty">Loading your household's list…</div></div>`;return;}
  if(!all.length){$("#listHost").innerHTML=`<div class="list"><div class="empty"><h2>${store===Cloud?"Your shared list is empty":"Your cabinet is empty"}</h2>Tap <b>Scan barcode</b> and hold a can or box up to the camera. The app looks up what it is, you confirm the name, and every scan after that adds one.</div></div>`;return;}
  if(!rows.length){$("#listHost").innerHTML=`<div class="list"><div class="empty">Nothing matches that search.</div></div>`;return;}
  $("#listHost").innerHTML=`<div class="list">${rows.map(i=>{const qty=Math.max(0,i.qty||0),isLow=qty<=(i.low??0),f=fr.get(i.id);
    const freshTag=f.state==="past"?`<span class="tag past">Past ${fmtDate(f.next)}</span>`:f.state==="soon"?`<span class="tag soon">Use by ${fmtDate(f.next)}</span>`:"";return`
    <div class="row"><button class="main" data-edit="${esc(i.id)}">${thumbHTML(i)}<span class="text">
      <div class="name">${esc(i.name||"Unnamed item")}</div>
      <div class="meta"><span>${esc(i.location||"Cabinet")}</span>${freshTag}${isLow?`<span class="tag">${qty===0?"Out":"Low"}</span>`:""}</div>
    </span></button><div class="stepper">
      <button data-dec="${esc(i.id)}" aria-label="Use one ${esc(i.name)}">−</button>
      <span class="qty ${qty===0?"zero":""}">${qty}</span>
      <button data-inc="${esc(i.id)}" aria-label="Add one ${esc(i.name)}">+</button>
    </div></div>`;}).join("")}</div>`;
}

const BANNER_KEY="cabinet-count:soon-banner-hidden";
function renderBanner(soon){
  const el=$("#soonBanner"),today=new Date().toDateString();
  if(!soon.length||state.filter==="Soon"||lsGet(BANNER_KEY)===today){el.hidden=true;return;}
  const past=soon.filter(i=>freshness(i).state==="past").length;
  el.innerHTML=`<span>${soon.length===1?`<b>${esc(soon[0].name)}</b> should be used`:`<b>${soon.length} items</b> should be used`} soon${past?`, ${past} already past ${past===1?"its":"their"} estimated date`:""}.</span>
    <div class="btns"><button class="btn primary small" id="soonShow">Show</button><button class="btn plain small" id="soonHide">Hide for today</button></div>`;
  el.hidden=false;
  $("#soonShow").onclick=()=>{state.filter="Soon";render();};
  $("#soonHide").onclick=()=>{lsSet(BANNER_KEY,today);el.hidden=true;};
}

  drawPic();
  $("#picFile").addEventListener("change",async e=>{
    const f=e.target.files[0];e.target.value="";if(!f)return;
    try{fPhoto=await makeThumb(f);picRemoved=false;drawPic();}
    catch(_){toast("Couldn't read that photo. Try taking it again.");}
  });
  $("#picRemove").onclick=()=>{fImg="";fPhoto="";picRemoved=true;drawPic();};
  const doLookup=async()=>{
    const c=normCode($("#fCode").value),b=$("#lookBtn"),f=$("#foundNote");
    b.disabled=true;b.textContent="Looking it up…";
    const r=await lookup(c);looked=navigator.onLine;
    if(!$("#lookBtn"))return;
    b.disabled=false;b.textContent="Look up this barcode";
    if(r){if(r.name&&(!$("#fName").value.trim()||$("#fName").dataset.auto)){$("#fName").value=r.name;$("#fName").dataset.auto="1";}
      if(r.image&&!fPhoto&&!picRemoved)fImg=r.image;drawPic();
      if(r.tags)fTags=r.tags;drawFresh();
      f.textContent=`Found on ${r.source}. Edit the name if you like.`;f.className="found";}
    else{f.textContent=navigator.onLine?"Not found in the product databases. Type a name.":"You're offline, so the lookup didn't run. Type a name.";f.className="note";}
    f.hidden=false;
  };
  $("#lookBtn").onclick=doLookup;
  $("#fName").oninput=e=>{delete e.target.dataset.auto;if(!fImg&&!fPhoto)drawPic();drawFresh();};
  $("#cancelBtn").onclick=closeSheet;
  if($("#delBtn"))$("#delBtn").onclick=e=>{
    if(!armed(e.target,"Tap again to delete"))return;
    const gone={...state.items.find(x=>x.id===it.id)};store.remove(it.id);closeSheet();
    toast(`Deleted ${gone.name||"item"}`,()=>store.restore(gone));
  };
  $("#saveBtn").onclick=()=>{
    const name=$("#fName").value.trim(),code=normCode($("#fCode").value),err=$("#formErr");
    if(!name){err.textContent="Give the item a name so you can find it later.";err.hidden=false;$("#fName").focus();return;}
    const dupe=code&&findByCode(code);
    if(dupe&&dupe.id!==it.id){err.textContent=`That barcode already belongs to ${dupe.name}.`;err.hidden=false;return;}
    const data={name,barcode:code,location:$("#fLoc").value,qty:$("#fQty").value,low:$("#fLow").value,
      img:fImg,photo:fPhoto,imgOff:picRemoved||(!!it.imgOff&&code===it.barcode),
      imgTry:looked?IMG_TRY:(code===it.barcode?it.imgTry:0)};
    const fd=draft();
    Object.assign(data,{lots:fd.lots,addedAt:fd.addedAt,cat:fd.cat,catSet:fd.catSet,keep:fd.keep,useBy:fd.useBy,useByAt:fd.useByAt});
    if(it.id)store.update(it.id,data);else store.add(data);
    closeSheet();
    toast(it.id?`Saved ${name}`:`Added ${name} · ${Math.max(0,parseInt(data.qty)||0)} on the shelf`);
  };
  if(lookupCode)doLookup();
  else if(!it.name)setTimeout(()=>$("#fName")?.focus(),250);
}

    "auth/user-not-found":"No account uses that email. Tap Create an account.",
    "auth/email-already-in-use":"An account already uses that email. Sign in instead.",
    "auth/invalid-email":"That email address doesn't look right.",
    "auth/weak-password":"Use a password with at least 6 characters.",
    "auth/missing-password":"Enter your password.",
    "auth/too-many-requests":"Too many tries. Wait a few minutes and try again.",
    "auth/network-request-failed":"You're offline. Connect to the internet to sign in.",
    "auth/popup-blocked":"Your browser blocked the Google window. Try again, or use email instead.",

/* ===================== live scanner ===================== */
let stream=null,zreader=null,loopTimer=null,lastCode="",lastAt=0,busy=false;
async function openScanner(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    itemForm({title:"Add an item",item:{qty:1},note:{err:true,text:"This browser can't use the camera. Open the app in Safari or Chrome, or type the barcode below."}});return;
  }
  $("#scanner").hidden=false;$("#scanHit").hidden=true;$("#scanMsg").textContent="Starting camera…";
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}});
  }catch(e){
    closeScanner();
    const denied=e&&(e.name==="NotAllowedError"||e.name==="SecurityError");
    itemForm({title:"Camera unavailable",item:{qty:1},note:{err:true,text:denied?"Camera access is turned off for this app. Allow it in your phone's settings for Safari or Chrome, then try again. You can type the barcode below meanwhile.":"The camera couldn't start. Close other apps using it and try again, or type the barcode below."}});
    return;
  }
  const video=$("#video");
  const track=stream.getVideoTracks()[0];
  const caps=track.getCapabilities?track.getCapabilities():{};
  $("#torchBtn").hidden=!caps.torch;
  $("#scanMsg").textContent="Line the barcode up inside the box";
  let native=null;
  if("BarcodeDetector" in window){
    try{const fm=await BarcodeDetector.getSupportedFormats();
      const want=["ean_13","ean_8","upc_a","upc_e","code_128","code_39","itf","qr_code"].filter(f=>fm.includes(f));
      if(want.length)native=new BarcodeDetector({formats:want});}catch(e){}
  }
  if(native){
    video.srcObject=stream;await video.play().catch(()=>{});
    const tick=async()=>{
      if(!stream)return;
      if(video.readyState>=2&&!busy){try{const r=await native.detect(video);if(r.length)onCode(r[0].rawValue);}catch(e){}}
      loopTimer=setTimeout(tick,120);
    };tick();
  }else if(window.ZXing){
    const Z=window.ZXing,h=new Map();
    h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E,Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.CODE_39,Z.BarcodeFormat.ITF,Z.BarcodeFormat.QR_CODE]);
    h.set(Z.DecodeHintType.TRY_HARDER,true);
    zreader=new Z.BrowserMultiFormatReader(h,150);
    zreader.decodeFromStream(stream,video,(res)=>{if(res&&!busy)onCode(res.getText());}).catch(()=>{});
  }else{
    closeScanner();toast("The barcode reader didn't load. Reload the app and try again.");
  }
}
function closeScanner(){
  clearTimeout(loopTimer);
  if(zreader){try{zreader.reset();}catch(e){}zreader=null;}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  $("#video").srcObject=null;$("#scanner").hidden=true;busy=false;
}
function feedback(){
  try{navigator.vibrate&&navigator.vibrate(60);}catch(e){}
  try{const a=feedback.ctx||(feedback.ctx=new (window.AudioContext||window.webkitAudioContext)());
    const o=a.createOscillator(),g=a.createGain();o.frequency.value=1250;g.gain.value=.08;
    o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.08);}catch(e){}
}
function onCode(raw){
  const code=normCode(raw);if(!code)return;
  const now=Date.now();
  if(code===lastCode&&now-lastAt<2000)return; // same can still in view
  lastCode=code;lastAt=now;feedback();
  const hit=findByCode(code);
  if(hit){
    const r=bump(hit.id,state.mode==="add"?1:-1);
    const h=$("#scanHit");h.hidden=false;
    h.textContent=r.prev===r.next?`${hit.name} is already at 0`:`${state.mode==="add"?"+1":"−1"} ${hit.name} · now ${r.next}`;
    $("#scanMsg").textContent="Keep scanning, or tap Done";
    return;
  }
  busy=true;closeScanner();
  itemForm({title:"New item",item:{barcode:code,qty:state.mode==="add"?1:0},lookupCode:true,
    note:{text:`Scanned ${codeKind(code)} ${prettyCode(code)}. Confirm the name once and future scans will count it.`}});
}
$("#scanBtn").onclick=openScanner;
$("#scanClose").onclick=closeScanner;
$("#torchBtn").onclick=async()=>{
  const t=stream&&stream.getVideoTracks()[0];if(!t)return;
  const on=$("#torchBtn").dataset.on!=="1";
  try{await t.applyConstraints({advanced:[{torch:on}]});$("#torchBtn").dataset.on=on?"1":"";$("#torchBtn").textContent=on?"Light off":"Light";}catch(e){}
};
document.addEventListener("visibilitychange",()=>{if(document.hidden&&stream)closeScanner();});

  else if(t.dataset.edit)itemForm({title:"Edit item",item:state.items.find(i=>i.id===t.dataset.edit)});
});
function setMode(m){state.mode=m;$("#modeAdd").setAttribute("aria-pressed",m==="add");$("#modeUse").setAttribute("aria-pressed",m==="use");}
$("#modeAdd").onclick=()=>setMode("add");$("#modeUse").onclick=()=>setMode("use");
$("#manualBtn").onclick=()=>itemForm({title:"Add an item",item:{qty:1},note:{text:"Type the digits under the barcode and tap Look up, or leave it blank for things without one."}});
$("#menuBtn").onclick=openMenu;

/* ===================== boot ===================== */
Local.load();
if(lsGet(CLOUD_FLAG)){
  // Signed in before: go straight to the shared list (works offline from the phone's saved copy).
  state.loading=true;render();
  ensureCloud().then(ok=>{if(!ok)switchStore(Local);});
}else{
  Local.start();
}
maybeWhatsNew();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
